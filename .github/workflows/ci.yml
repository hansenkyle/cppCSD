name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # jidicula/clang-format-action runs clang-format from a Docker image
      # built from each Ubuntu release's *native* clang-format-<N> package
      # (see https://github.com/jidicula/clang-format-action), rather than
      # apt.llvm.org's rolling snapshot builds -- those can drift from the
      # actual tagged release under the same version string, which is what
      # caused local/CI formatting results to disagree here previously.
      # include-regex mirrors scripts/format.sh and check-format.sh, which
      # only cover *.cpp/*.hpp (see the Formatting section of CLAUDE.md for
      # the known *.h gap).
      - name: Check src/ formatting
        uses: jidicula/clang-format-action@v4.18.0
        with:
          clang-format-version: "21"
          check-path: "src"
          include-regex: ".*\\.(cpp|hpp)$"

      - name: Check test/ formatting
        uses: jidicula/clang-format-action@v4.18.0
        with:
          clang-format-version: "21"
          check-path: "test"
          include-regex: ".*\\.(cpp|hpp)$"

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ldcsd's CMakeLists.txt requires CMake 4.0; ubuntu-latest's apt
      # repo lags behind, so fetch a current CMake binary directly rather
      # than relying on the distro package.
      - name: Set up CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "^4.0.0"

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DLDCSD_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j

      - name: Run unit tests
        run: ./build/unit_test

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit the badge SVG back to the repo
    steps:
      - uses: actions/checkout@v4

      - name: Set up CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "^4.0.0"

      - name: Install gcovr
        run: pip install --user gcovr

      - name: Configure (coverage build)
        run: >
          cmake -B build-coverage
          -DCMAKE_BUILD_TYPE=Debug
          -DLDCSD_BUILD_TESTS=ON
          -DLDCSD_ENABLE_COVERAGE=ON

      - name: Build
        run: cmake --build build-coverage -j --target unit_test

      - name: Run tests to generate coverage data
        run: ./build-coverage/unit_test

      - name: Generate coverage report and summary
        run: |
          mkdir -p build-coverage/coverage-report
          gcovr \
            --root . \
            --object-directory build-coverage \
            --exclude '.*/_deps/.*' \
            --exclude '.*/test/.*' \
            --html --html-details -o build-coverage/coverage-report/index.html \
            --json-summary-pretty --json-summary build-coverage/coverage-summary.json \
            --print-summary

      - name: Upload HTML coverage report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build-coverage/coverage-report

      - name: Extract coverage percentage
        id: coverage
        run: |
          PCT=$(python3 -c "import json; d = json.load(open('build-coverage/coverage-summary.json')); print(round(d['line_percent'], 1))")
          echo "percent=$PCT" >> "$GITHUB_OUTPUT"
          if   (( $(echo "$PCT >= 90" | bc -l) )); then COLOR=brightgreen
          elif (( $(echo "$PCT >= 75" | bc -l) )); then COLOR=green
          elif (( $(echo "$PCT >= 50" | bc -l) )); then COLOR=yellow
          else COLOR=red
          fi
          echo "color=$COLOR" >> "$GITHUB_OUTPUT"

      - name: Generate badge SVG
        run: |
          mkdir -p badges
          curl -s "https://img.shields.io/badge/coverage-${{ steps.coverage.outputs.percent }}%25-${{ steps.coverage.outputs.color }}" \
            -o badges/coverage.svg

      - name: Commit badge
        if: github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update coverage badge [skip ci]"
          file_pattern: badges/coverage.svg
