[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ldcsd"
version = "0.1.0"
description = "Reads ldcsd run results (.h5)"
license = "BSD-3-Clause"
requires-python = ">=3.10"
dependencies = ["h5py", "numpy"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["ldcsd"]
