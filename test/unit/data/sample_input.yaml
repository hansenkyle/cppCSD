      - {up_left: 112.1, up_right: 112.2, down_left: 112.3, down_right: 112.4}
    - # g=2
      - {up_left: 120.1, up_right: 120.2, down_left: 120.3, down_right: 120.4}
      - {up_left: 121.1, up_right: 121.2, down_left: 121.3, down_right: 121.4}
      - {up_left: 122.1, up_right: 122.2, down_left: 122.3, down_right: 122.4}
  - # m=2
