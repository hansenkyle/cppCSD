# Sample ldcsd input deck used by the InputDeck unit tests.

spatial_mesh: [0.0, 1.0, 2.0, 3.0]

regions:
  materials: [water, water, lead]

energy_mesh: [5.0, 1.0, 0.5, 0.0] # MeV, descending group boundaries, ending at 0

materials:
  water:
    sigma_t: [1.2, 1.0, 0.8]
    # Sparse group-to-group scattering matrix: in-group (diagonal) plus a
    # small downscatter band. Only nonzero entries need to appear.
    scattering:
      - {from: 0, to: 0, value: 1.1}
      - {from: 0, to: 1, value: 0.05}
      - {from: 1, to: 1, value: 0.9}
      - {from: 1, to: 2, value: 0.03}
      - {from: 2, to: 2, value: 0.7}
    stopping_power:
      group_average: [2.0, 1.8, 1.5]
      group_boundary: [2.2, 1.9, 1.6, 1.3]
  lead:
    sigma_t: [3.2, 3.0, 2.8]
    scattering:
      - {from: 0, to: 0, value: 2.1}
      - {from: 0, to: 1, value: 0.1}
      - {from: 1, to: 1, value: 1.9}
      - {from: 1, to: 2, value: 0.08}
      - {from: 2, to: 2, value: 1.7}
    stopping_power:
      group_average: [5.0, 4.8, 4.5]
      group_boundary: [5.2, 4.9, 4.6, 4.3]

angular_quadrature:
  mu: [-0.9, -0.3, 0.3, 0.9]
  w: [0.5, 0.5, 0.5, 0.5]

# down/up values below follow left = 10*ordinate + group, right = 100*ordinate
# + group (up = down + 0.5), purely so the unit test can check specific
# entries against a formula rather than a wall of unrelated numbers.
boundary_conditions:
  left:
    down: [[0, 1, 2], [10, 11, 12], [20, 21, 22], [30, 31, 32]]
    up: [[0.5, 1.5, 2.5], [10.5, 11.5, 12.5], [20.5, 21.5, 22.5], [30.5, 31.5, 32.5]]
  right:
    down: [[0, 1, 2], [100, 101, 102], [200, 201, 202], [300, 301, 302]]
    up: [[0.5, 1.5, 2.5], [100.5, 101.5, 102.5], [200.5, 201.5, 202.5], [300.5, 301.5, 302.5]]

convergence:
  max_iters: 200
  epsilon: 1.0e-8
