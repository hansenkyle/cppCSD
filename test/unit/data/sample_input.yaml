# Sample ldcsd input deck used by the InputDeck unit tests.

spatial_mesh: [0.0, 1.0, 2.0, 3.0]

regions:
  materials: [water, water, lead]

energy_mesh: [5.0, 1.0, 0.5, 0.0] # MeV, descending group boundaries, ending at 0

materials:
  water:
    sigma_t: [1.2, 1.0, 0.8]
    # Sparse group-to-group scattering matrix: only nonzero (from, to)
    # entries need to appear. Group indices are 1-indexed.
    scattering:
      - {from: 1, to: 1, value: 1.1}
      - {from: 1, to: 2, value: 0.05}
      - {from: 2, to: 2, value: 0.9}
      - {from: 2, to: 3, value: 0.03}
      - {from: 3, to: 3, value: 0.7}
    stopping_power:
      group_average: [2.0, 1.8, 1.5]
      group_boundary: [2.2, 1.9, 1.6, 1.3]
  lead:
    sigma_t: [3.2, 3.0, 2.8]
    # Dense group-to-group scattering matrix: G rows of G values each, row
    # = from group, column = to group. Equivalent to the sparse form above,
    # just with zeros written out instead of omitted.
    scattering:
      - [2.1, 0.1, 0.0]
      - [0.0, 1.9, 0.08]
      - [0.0, 0.0, 1.7]
    stopping_power:
      group_average: [5.0, 4.8, 4.5]
      group_boundary: [5.2, 4.9, 4.6, 4.3]

angular_quadrature:
  mu: [-0.9, -0.3, 0.3, 0.9]
  w: [0.5, 0.5, 0.5, 0.5]

# down/up values below follow down[g][m] = 10*m + g, up = down + 0.5, purely
# so the unit test can check specific entries against a formula rather than
# a wall of unrelated numbers.
boundary_conditions:
  down: [[0, 10, 20, 30], [1, 11, 21, 31], [2, 12, 22, 32]]
  up: [[0.5, 10.5, 20.5, 30.5], [1.5, 11.5, 21.5, 31.5], [2.5, 12.5, 22.5, 32.5]]

# Nested [m][g][cell], each cell a named-corner map. Values below follow
# base = 100*m + 10*g + c, with up_left/up_right/down_left/down_right =
# base + 0.1/0.2/0.3/0.4, purely so the unit test can check specific entries
# against a formula rather than a wall of unrelated numbers.
source:
  - # m=0
    - # g=0
      - {up_left: 0.1, up_right: 0.2, down_left: 0.3, down_right: 0.4}
      - {up_left: 1.1, up_right: 1.2, down_left: 1.3, down_right: 1.4}
      - {up_left: 2.1, up_right: 2.2, down_left: 2.3, down_right: 2.4}
    - # g=1
      - {up_left: 10.1, up_right: 10.2, down_left: 10.3, down_right: 10.4}
      - {up_left: 11.1, up_right: 11.2, down_left: 11.3, down_right: 11.4}
      - {up_left: 12.1, up_right: 12.2, down_left: 12.3, down_right: 12.4}
    - # g=2
      - {up_left: 20.1, up_right: 20.2, down_left: 20.3, down_right: 20.4}
      - {up_left: 21.1, up_right: 21.2, down_left: 21.3, down_right: 21.4}
      - {up_left: 22.1, up_right: 22.2, down_left: 22.3, down_right: 22.4}
  - # m=1
    - # g=0
      - {up_left: 100.1, up_right: 100.2, down_left: 100.3, down_right: 100.4}
      - {up_left: 101.1, up_right: 101.2, down_left: 101.3, down_right: 101.4}
      - {up_left: 102.1, up_right: 102.2, down_left: 102.3, down_right: 102.4}
