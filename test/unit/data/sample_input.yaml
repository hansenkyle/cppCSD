# Sample ldcsd input deck used by the InputDeck unit tests.

spatial_mesh: [0.0, 1.0, 2.0, 3.0]

regions:
  materials: [water, water, lead]

energy_mesh: [5.0, 1.0, 0.5, 0.0] # MeV, descending group boundaries, ending at 0

materials:
  water:
    sigma_t: [1.2, 1.0, 0.8]
    sigma_s: [1.1, 0.9, 0.7]
    stopping_power:
      group_average: [2.0, 1.8, 1.5]
      group_boundary: [2.2, 1.9, 1.6, 1.3]
  lead:
    sigma_t: [3.2, 3.0, 2.8]
    sigma_s: [2.1, 1.9, 1.7]
    stopping_power:
      group_average: [5.0, 4.8, 4.5]
      group_boundary: [5.2, 4.9, 4.6, 4.3]

angular_quadrature:
  mu: [-0.9, -0.3, 0.3, 0.9]
  w: [0.5, 0.5, 0.5, 0.5]

# down/up values below follow down[g][m] = 10*m + g, up = down + 0.5, purely
# so the unit test can check specific entries against a formula rather than
# a wall of unrelated numbers.
boundary_conditions:
  down: [[0, 10, 20, 30], [1, 11, 21, 31], [2, 12, 22, 32]]
  up: [[0.5, 10.5, 20.5, 30.5], [1.5, 11.5, 21.5, 31.5], [2.5, 12.5, 22.5, 32.5]]
